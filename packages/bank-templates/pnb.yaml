bank_id: pnb
display_name: "Punjab National Bank"
bank_code: "PNB"
bank_name: "Punjab National Bank"
type: "pdf_text"

fingerprint:
  keywords:
    - "Punjab National Bank"
    - "PUNJAB NATIONAL BANK"
    - "PNB"
    - "Account Statement"
  regex:
    - "IFSC\\s*:?\\s*PUNB0[0-9]{6}"

extraction:
  skip_headers: 1
  headers:
    - "Txn Date"
    - "Value Date"
    - "Description"
    - "Cheque No"
    - "Debit"
    - "Credit"
    - "Balance"
  columns:
    date: 0
    value_date: 1
    narration: 2
    reference: 3
    debit: 4
    credit: 5
    balance: 6
  formats:
    date: "%d/%m/%Y"
    number: "indian"
