bank_id: indusind
display_name: "IndusInd Bank"
bank_code: "INDUSIND"
bank_name: "IndusInd Bank Ltd."
type: "pdf_text"

fingerprint:
  keywords:
    - "IndusInd Bank"
    - "INDUSIND BANK"
    - "INDUSINDBANK"
    - "Statement of Account"
  regex:
    - "IFSC\\s*:?\\s*INDB0[0-9]{6}"

extraction:
  skip_headers: 1
  headers:
    - "Date"
    - "Particulars"
    - "Chq./Ref. No."
    - "Withdrawals"
    - "Deposits"
    - "Balance"
  columns:
    date: 0
    narration: 1
    reference: 2
    debit: 3
    credit: 4
    balance: 5
  formats:
    date: "%d-%m-%Y"
    number: "indian"
