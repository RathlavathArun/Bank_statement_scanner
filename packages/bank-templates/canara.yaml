bank_id: canara
display_name: "Canara Bank"
bank_code: "CANARA"
bank_name: "Canara Bank"
type: "pdf_text"

fingerprint:
  keywords:
    - "Canara Bank"
    - "CANARA BANK"
    - "CANARABANK"
    - "Statement of Account"
  regex:
    - "IFSC\\s*:?\\s*CNRB0[0-9]{6}"

extraction:
  skip_headers: 1
  headers:
    - "Date"
    - "Particulars"
    - "Cheque No"
    - "Withdrawals"
    - "Deposits"
    - "Balance"
  columns:
    date: 0
    narration: 1
    reference: 2
    debit: 3
    credit: 4
    balance: 5
  formats:
    date: "%d/%m/%Y"
    number: "indian"
