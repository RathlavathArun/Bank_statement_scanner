bank_id: iob
display_name: "Indian Overseas Bank"
bank_code: IOB
bank_name: "Indian Overseas Bank"
type: "pdf_text"

fingerprint:
  keywords:
    - "Indian Overseas Bank"
    - "Account Statement"
  regex:
    - "IFSC\\s*:?\\s*IOBA0[0-9]{6}"

extraction:
  headers:
    - "Date"
    - "Particulars"
    - "Chq No"
    - "Withdrawals"
    - "Deposits"
    - "Balance"

  columns:
    date: 0
    narration: 1
    reference: 2
    debit: 3
    credit: 4
    balance: 5

  formats:
    date: "%d/%m/%Y"
    number: "indian"
