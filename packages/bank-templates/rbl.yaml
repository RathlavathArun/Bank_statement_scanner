bank_id: rbl
display_name: "RBL Bank"
bank_code: "RBL"
bank_name: "RBL Bank Ltd."
type: "pdf_text"

fingerprint:
  keywords:
    - "RBL Bank"
    - "RATNAKAR BANK"
    - "RBLBANK"
    - "Account Statement"
  regex:
    - "IFSC\\s*:?\\s*RATN0[0-9]{6}"

extraction:
  skip_headers: 1
  headers:
    - "Txn Date"
    - "Value Date"
    - "Description"
    - "Cheque/Ref No"
    - "Debit"
    - "Credit"
    - "Balance"
  columns:
    date: 0
    value_date: 1
    narration: 2
    reference: 3
    debit: 4
    credit: 5
    balance: 6
  formats:
    date: "%d/%m/%Y"
    number: "indian"
