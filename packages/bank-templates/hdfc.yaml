bank_code: "HDFC"
bank_name: "HDFC Bank Ltd."
type: "pdf_text"

fingerprint:
  keywords:
    - "HDFC BANK"
    - "Statement of Account"
  regex:
    - "IFSC\\s*:\\s*HDFC000[0-9]{4}"

extraction:
  skip_headers: 1
  headers:
    - "Date"
    - "Narration"
    - "Chq./Ref.No."
    - "Value Dt"
    - "Withdrawal Amt."
    - "Deposit Amt."
    - "Closing Balance"
  
  columns:
    date: 0
    narration: 1
    reference: 2
    value_date: 3
    debit: 4
    credit: 5
    balance: 6

  formats:
    date: "%d/%m/%y"
    number: "indian"
