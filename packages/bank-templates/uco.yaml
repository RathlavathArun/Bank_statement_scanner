    - "UCO Bank"
    - "Account Statement"
  regex:
    - "IFSC\\s*:?\\s*UCBA0[0-9]{6}"

extraction:
  headers:
    - "Date"
    - "Particulars"
    - "Instrument No"
    - "Debit"
    - "Credit"
    - "Balance"

  columns:
    date: 0
    narration: 1
    reference: 2
    debit: 3
    credit: 4
    balance: 5

  formats:
    date: "%d/%m/%Y"
    number: "indian"
