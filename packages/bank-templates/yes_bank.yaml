bank_id: yes_bank
display_name: "Yes Bank"
bank_code: "YES"
bank_name: "Yes Bank Ltd."
type: "pdf_text"

fingerprint:
  keywords:
    - "YES BANK"
    - "Yes Bank Ltd"
    - "YESBANK"
    - "Statement of Account"
  regex:
    - "IFSC\\s*:?\\s*YESB0[0-9]{6}"

extraction:
  skip_headers: 1
  headers:
    - "Transaction Date"
    - "Value Date"
    - "Description"
    - "Cheque No/Reference No"
    - "Debit"
    - "Credit"
    - "Balance"
  columns:
    date: 0
    value_date: 1
    narration: 2
    reference: 3
    debit: 4
    credit: 5
    balance: 6
  formats:
    date: "%d/%m/%Y"
    number: "indian"
