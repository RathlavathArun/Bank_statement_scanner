bank_id: au_small_finance
display_name: "AU Small Finance Bank"
bank_code: "AU"
bank_name: "AU Small Finance Bank Ltd."
type: "pdf_text"

fingerprint:
  keywords:
    - "AU Small Finance Bank"
    - "AU SMALL FINANCE BANK"
    - "AUBANK"
    - "Account Statement"
  regex:
    - "IFSC\\s*:?\\s*AUBL0[0-9]{6}"

extraction:
  skip_headers: 1
  headers:
    - "Transaction Date"
    - "Value Date"
    - "Narration"
    - "Reference No"
    - "Debit"
    - "Credit"
    - "Balance"
  columns:
    date: 0
    value_date: 1
    narration: 2
    reference: 3
    debit: 4
    credit: 5
    balance: 6
  formats:
    date: "%d/%m/%Y"
    number: "indian"
