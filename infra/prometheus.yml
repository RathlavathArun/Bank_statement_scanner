global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ─── FastAPI Bank Statement API ───────────────────────────
  - job_name: "bse_api"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics

  # ─── Redis ────────────────────────────────────────────────
  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  # ─── Prometheus self-monitoring ──────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
